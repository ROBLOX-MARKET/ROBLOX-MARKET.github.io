```html
<script>

const SUPABASE_URL =
"https://tldlfdztqcwksziosdyl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BD1nN2-272T3_w4E8l0xtQ_f0oTJDW5";


async function loadProducts() {

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/PRODUCTS?select=*",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        const products = await response.json();

        if (!response.ok) {
            console.error("SUPABASE ERROR:", products);
            showError();
            return;
        }

        showCategory("sab", products);
        showCategory("mm2", products);
        showCategory("other", products);

    } catch (error) {

        console.error("ERROR:", error);
        showError();

    }
}


function showCategory(category, products) {

    const container =
        document.querySelector("#" + category + " .products");

    if (!container) return;

    container.innerHTML = "";

    const matchingProducts = products.filter(function(product) {

        return String(product.CATAGORY || "")
            .trim()
            .toLowerCase() === category;

    });


    if (matchingProducts.length === 0) {

        container.innerHTML = `
            <div class="product">
                <h3>COMING SOON</h3>
                <p>No products available yet.</p>
            </div>
        `;

        return;
    }


    matchingProducts.forEach(function(product) {

        const card = document.createElement("div");

        card.className = "product";


        const image =
            product.IMAGE ||
            "https://placehold.co/500x500/10151e/2979ff?text=Roblox";

        const name =
            product.NAME || "Product";

        const description =
            product.DESCRIPTION || "";

        const price =
            product.PRICE || "0";


        card.innerHTML = `

            <img
                class="product-image"
                src="${image}"
                alt="${name}"
            >

            <h3>${name}</h3>

            <p>${description}</p>

            <div class="product-bottom">

                <span class="price">
                    £${price}
                </span>

                <button
                    class="buy"
                    type="button"
                >
                    BUY
                </button>

            </div>

        `;


        const buyButton =
            card.querySelector(".buy");


        buyButton.addEventListener(
            "click",
            function() {
                buyProduct(name);
            }
        );


        container.appendChild(card);

    });

}


async function buyProduct(productName) {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/functions/v1/create-checkout",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    productName: productName
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            console.error("CHECKOUT ERROR:", data);

            alert(
                data.error ||
                "Payment could not be started."
            );

            return;
        }


        if (!data.url) {

            alert(
                "Stripe checkout URL was not returned."
            );

            return;
        }


        window.location.href = data.url;

    } catch (error) {

        console.error("PAYMENT ERROR:", error);

        alert("Payment could not be started.");

    }

}


function showError() {

    document.querySelectorAll(".products")
        .forEach(function(container) {

            container.innerHTML = `
                <div class="product">
                    <h3>ERROR</h3>
                    <p>Products could not load.</p>
                </div>
            `;

        });

}


loadProducts();

</script>
```
