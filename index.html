<script>

const SUPABASE_URL = "https://tldlfdztqcwksziosdyl.supabase.co";
const SUPABASE_KEY = "sb_publishable_BD1nN2-272T3_w4E8l0xtQ_f0oTJDW5";


// ===============================
// CATEGORY CONTAINERS
// ===============================

const categories = {
    sab: document.querySelector("#sab .products"),
    mm2: document.querySelector("#mm2 .products"),
    other: document.querySelector("#other .products")
};


// ===============================
// LOAD PRODUCTS
// ===============================

async function loadProducts() {

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/PRODUCTS?select=*",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Could not load products");
        }

        const products = await response.json();

        console.log("Products:", products);


        // Clear existing products

        Object.values(categories).forEach(function(container) {

            if (container) {
                container.innerHTML = "";
            }

        });


        // Add products

        products.forEach(function(product) {

            const category = String(product.CATAGORY || "")
                .trim()
                .toLowerCase();

            const container = categories[category];

            if (!container) {
                return;
            }


            // Create product card

            const card = document.createElement("div");

            card.className = "product";


            card.innerHTML = `

                <div class="product-image">

                    ${
                        product.IMAGE
                        ? `
                            <img
                                src="${escapeHtml(product.IMAGE)}"
                                alt="${escapeHtml(product.NAME)}"
                            >
                          `
                        : ""
                    }

                </div>


                <div class="product-info">

                    <h3>
                        ${escapeHtml(product.NAME)}
                    </h3>


                    <p>
                        ${escapeHtml(product.DESCRIPTION || "")}
                    </p>


                    <div class="product-bottom">

                        <span class="price">
                            £${escapeHtml(product.PRICE || "0")}
                        </span>


                        <button
                            class="buy"
                            type="button"
                        >
                            BUY
                        </button>

                    </div>

                </div>

            `;


            // BUY BUTTON

            const buyButton = card.querySelector(".buy");


            buyButton.addEventListener("click", function() {

                buyProduct(
                    product.NAME,
                    buyButton
                );

            });


            // Add card to website

            container.appendChild(card);

        });


        // ===============================
        // COMING SOON
        // ===============================

        Object.entries(categories).forEach(function([category, container]) {

            if (
                container &&
                container.children.length === 0
            ) {

                container.innerHTML = `

                    <div class="coming-soon">
                        COMING SOON
                    </div>

                `;

            }

        });


    } catch (error) {

        console.error(
            "Product loading error:",
            error
        );

    }

}



// ===============================
// BUY PRODUCT
// ===============================

async function buyProduct(productName, button) {

    try {


        // Change button

        if (button) {

            button.disabled = true;

            button.textContent = "LOADING...";

        }


        // Contact Supabase checkout function

        const response = await fetch(

            SUPABASE_URL +
            "/functions/v1/create-checkout",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY

                },

                body: JSON.stringify({

                    productName:
                        productName

                })

            }

        );


        const data = await response.json();


        console.log(
            "Stripe checkout:",
            data
        );


        // Check for error

        if (
            !response.ok ||
            !data.url
        ) {

            alert(
                data.error ||
                "Could not create checkout."
            );


            if (button) {

                button.disabled = false;

                button.textContent = "BUY";

            }

            return;

        }


        // Send customer to Stripe

        window.location.href = data.url;


    } catch (error) {


        console.error(
            "Checkout error:",
            error
        );


        alert(
            "Something went wrong. Please try again."
        );


        if (button) {

            button.disabled = false;

            button.textContent = "BUY";

        }

    }

}



// ===============================
// SECURITY
// ===============================

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ===============================
// START WEBSITE
// ===============================

loadProducts();

</script>
