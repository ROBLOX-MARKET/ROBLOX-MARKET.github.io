<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBLOX MARKET</title>

<style>
body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 50px 20px;
    background: #10151e;
}

h1 {
    color: #2979ff;
    font-size: 40px;
}

header p {
    color: #aaa;
}

.discord {
    display: inline-block;
    background: #5865f2;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

section {
    margin-bottom: 50px;
}

h2 {
    border-left: 4px solid #2979ff;
    padding-left: 12px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: #10151e;
    border: 1px solid #222c3b;
    border-radius: 12px;
    padding: 20px;
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.product h3 {
    margin-bottom: 10px;
}

.price {
    color: #2979ff;
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.buy {
    display: block;
    text-align: center;
    background: #2979ff;
    color: white;
    padding: 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>ROBLOX MARKET</h1>
    <p>Premium Roblox Products</p>

    <a class="discord"
       href="https://discord.gg/HYMytMjCCX"
       target="_blank">
       JOIN DISCORD
    </a>
</header>

<div class="container">

<section>
<h2>SAB PRODUCTS</h2>

<div class="products" id="sab">
    <p>Loading products...</p>
</div>
</section>

<section>
<h2>MM2 PRODUCTS</h2>

<div class="products" id="mm2">
    <p>Loading products...</p>
</div>
</section>

<section>
<h2>OTHER PRODUCTS</h2>

<div class="products" id="other">
    <p>Loading products...</p>
</div>
</section>

</div>

<script>

const SUPABASE_URL =
"https://tldlfdztqcwksziosdyl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BD1nN2-272T3_w4E8l0xtQ_f0oTJDW5";


async function loadProducts() {

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/PRODUCTS?select=*",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Could not load products");
        }

        const products = await response.json();

        showProducts(products, "sab", "SAB");
        showProducts(products, "mm2", "MM2");
        showProducts(products, "other", "Other");

    } catch (error) {

        console.log(error);

        document.getElementById("sab").innerHTML =
            "<p>Could not load products.</p>";

        document.getElementById("mm2").innerHTML =
            "<p>Could not load products.</p>";

        document.getElementById("other").innerHTML =
            "<p>Could not load products.</p>";
    }
}


function showProducts(products, id, category) {

    const box = document.getElementById(id);

    const matching = products.filter(function(product) {

        return String(product.CATAGORY || "").toLowerCase()
            === category.toLowerCase();

    });


    if (matching.length === 0) {

        box.innerHTML = "<p>No products yet.</p>";
        return;

    }


    box.innerHTML = "";


    matching.forEach(function(product) {

        const card = document.createElement("div");

        card.className = "product";


        card.innerHTML = `
            <img src="${product.IMAGE || "https://placehold.co/500x300"}">

            <h3>${product.NAME || ""}</h3>

            <p>${product.DESCRIPTION || ""}</p>

            <div class="price">
                ${product.PRICE || ""}
            </div>

            <a class="buy"
               href="${product.DISCORD_LINK || "https://discord.gg/HYMytMjCCX"}"
               target="_blank">
               BUY
            </a>
        `;


        box.appendChild(card);

    });

}


loadProducts();

</script>

</body>
</html>
