<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROBLOX MARKET</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
      background: rgba(8, 11, 18, 0.95);
      border-bottom: 1px solid #202938;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #2979ff;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      color: #c9d0dc;
      font-size: 14px;
      font-weight: 700;
    }

    nav a:hover {
      color: white;
    }

    .discord-nav {
      background: #2979ff;
      color: white !important;
      padding: 10px 17px;
      border-radius: 8px;
    }

    .hero {
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px;
      background:
        radial-gradient(circle at 50% 30%, #153b80 0%, transparent 35%),
        linear-gradient(180deg, #080b12, #0a0e17);
    }

    .hero-content {
      max-width: 850px;
    }

    .small-title {
      color: #2979ff;
      font-weight: 900;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(50px, 9vw, 100px);
      line-height: 0.95;
      font-weight: 1000;
      letter-spacing: -5px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #2979ff;
    }

    .hero p {
      color: #9da8b8;
      font-size: 18px;
      max-width: 600px;
      margin: auto;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 9px;
      font-weight: 900;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .blue-button {
      background: #2979ff;
      color: white;
    }

    .red-button {
      background: #ef3340;
      color: white;
    }

    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title small {
      color: #2979ff;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .section-title h2 {
      font-size: 45px;
      margin-top: 8px;
    }

    .section-title p {
      color: #8993a3;
      margin-top: 10px;
    }

    .empty-category {
      max-width: 900px;
      margin: auto;
      padding: 50px;
      text-align: center;
      border: 1px solid #222c3b;
      border-radius: 15px;
      background: #10151e;
      color: #687384;
    }

    .dark-section {
      background: #0c1119;
    }

    .discord {
      max-width: 1100px;
      margin: 30px auto 0;
      padding: 60px 40px;
      text-align: center;
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          rgba(41, 121, 255, 0.2),
          rgba(239, 51, 64, 0.12)
        );
      border: 1px solid #273448;
    }

    .discord h2 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .discord p {
      color: #9aa5b5;
      max-width: 600px;
      margin: auto;
    }

    .discord .button {
      margin-top: 28px;
    }

      padding: 35px 7%;
      border-top: 1px solid #202938;
      display: flex;
      justify-content: space-between;
      align-items
